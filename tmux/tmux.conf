# ~/.tmux.conf

# Tmux Plugin Manager
# See: https://github.com/tmux-plugins/tpm

# Install plugins in the XDG path
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'soyuka/tmux-current-pane-hostname'
set -g @plugin 'ianchesal/tmux-fzf-url#no-xre'
set -g @plugin 'sainnhe/tmux-fzf'
# set -g @plugin 'ianchesal/tmux-scout-golang'
set -g @plugin 'schasse/tmux-jump'

# See: https://jdhao.github.io/2018/10/19/tmux_nvim_true_color/
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ',xterm-kitty:RGB'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # undercurl color support

# Status bar at top
set-option -g status-position top

# No bells at all
set -g bell-action none

# Scroll History
set -g history-limit 10000

# Set ability to capture on start and restore on exit window data when running an application
setw -g alternate-screen on

# Lower escape timing from 500ms to 50ms for quicker response to scroll-buffer access.
set -s escape-time 50

# Index at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# send the prefix to client inside window
bind-key -n C-g send-prefix

# Some motion keys to make switching windows faster
bind -n S-Right next-window
bind -n S-Left previous-window

# Bind r to reloading the configuration
bind r source-file ~/.config/tmux/tmux.conf \; display "~/.config/tmux/tmux.conf sourced"

# Auto-name new sessions "main" if no session named "main" exists
set-hook -g session-created 'run-shell "if ! tmux has-session -t main 2>/dev/null && [ \"#{session_name}\" != \"main\" ]; then tmux rename-session main; fi"'

# Bind Shift-s to creating a new named session
bind S command-prompt -p "New Session:" "new-session -A -s '%%'"
# Bind Shift-k to killing current session
bind K confirm kill-session
# Bind C-f to finding windows
bind C-f command-prompt -p find-session "switch-client -t %%"

# Start new pans in the same working directory
bind c new-window -c "#{pane_current_path}"
# Some binds for easier splits
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -p 33 -c "#{pane_current_path}"

# Easy resizing of panes
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5

# Nice window behavior
setw -g automatic-rename on   # rename window automatically
# Name windows after the enclosing repo root instead of the running program.
# Same #() command string as window-status-format in theme.conf, so it shares
# tmux's global job cache and is kept warm by the status-line refresh; the guard
# falls back to the plain directory basename before that job has produced output.
setw -g automatic-rename-format "#{?#(~/.config/tmux/window-name.sh '#{pane_current_path}'),#(~/.config/tmux/window-name.sh '#{pane_current_path}'),#{b:pane_current_path}}"
set -g renumber-windows on    # renumber windows when a window is closed
set -g status-interval 1      # redraw status line every 1 second for more responsive updates

# Turn the mouse on, but without copy mode dragging
set -g mouse on
# unbind -n MouseDrag1Pane
# unbind -Tcopy-mode MouseDrag1Pane

# Keys to toggle monitoring activity in a window and the synchronize-panes option
bind m set monitor-activity
bind y set synchronize-panes\; display 'synchronize-panes #{?synchronize-panes,on,off}'
# setw -g monitor-activity on
# set -g visual-activity on

# tmux-fzf-url configuration
# Searches for URLs, passes them through FZF and lets me pick the one to open
set -g @fzf-url-bind 'u'
run-shell 'tmux set -g @fzf-url-open "$HOME/.config/tmux/open-url.sh"'

# VHS Era Theme
source-file ~/.config/tmux/theme.conf

# Google Cloud Workstation marker overlay.
# The twin of this test lives in zsh/zshrc.d/machine.zsh -- keep the two in sync.
# DOTFILES_MACHINE=gcw only overrides zsh -- if-shell is fixed at tmux server
# start, so to force the status-bar look, source theme-gcw.conf directly (see
# its header for the preview command).
# Accepted limitation: this if-shell only sees where the tmux *server*
# started, not where a pane is currently ssh'd into. If the server started on
# the Mac and you ssh into the workstation inside a pane, this never fires --
# the colors and the GCW badge stay Mac-colored. The #U@#H host chip is still
# correct either way: tmux-current-pane-hostname resolves it per-pane, so it
# always names the ssh target, not the server host.
if-shell '[ -d /etc/workstation-startup.d ]' 'source-file ~/.config/tmux/theme-gcw.conf'

# LAZYGIT
bind g popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"

# WORKMUX
bind w display-menu -x C -y C -T "workmux" \
    "add" a "popup -d '#{pane_current_path}' -w 80% -h 20% -x C -y C -E '~/.config/tmux/workmux/workmux-add-branch.sh'" \
    "add w/branch" b "popup -d '#{pane_current_path}' -w 80% -h 25% -x C -y C -E '~/.config/tmux/workmux/workmux-add-from-branch.sh'" \
    "add w/prompt" p "popup -d '#{pane_current_path}' -w 80% -h 20% -x C -y C -E '~/.config/tmux/workmux/workmux-add-prompt.sh'" \
    "open" o "popup -d '#{pane_current_path}' -w 80% -h 25% -x C -y C -E '~/.config/tmux/workmux/workmux-fzf.sh open'" \
    "remove" r "popup -d '#{pane_current_path}' -w 80% -h 25% -x C -y C -E '~/.config/tmux/workmux/workmux-fzf.sh remove'" \
    "close" c "popup -d '#{pane_current_path}' -w 80% -h 25% -x C -y C -E '~/.config/tmux/workmux/workmux-fzf.sh close'" \
    "dashboard" d "popup -d '#{pane_current_path}' -w 90% -h 90% -x C -y C -E 'workmux dashboard'" \
    "sidebar" s "run-shell 'workmux sidebar'" \
    "quit" q ""

# This needs to be last always
run '~/.config/tmux/plugins/tpm/tpm'
