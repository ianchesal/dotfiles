# Google Cloud Workstation marker
#
# Sourced from tmux.conf only when /etc/workstation-startup.d exists. Overrides
# the deltas from theme.conf; everything else is inherited.
#
# Preview on another machine (no environment dependency):
#   tmux source-file ~/.config/tmux/theme-gcw.conf
#
# Revert: `rake tmux:reload` re-sources theme.conf, which resets all 11
# options this overlay sets -- no residue.

# --- accent block -----------------------------------------------------------
# Format strings expand these on every redraw, so overriding them here recolors
# status-left/status-right without re-emitting either string.
set -g @theme_accent "#b8ff2e"
set -g @theme_host   "#{user}@gcw"
set -g @theme_badge  "GCW"

# Safety: #{E:...} expands its content twice, so anything #(shell)-shaped placed
# in @theme_host would execute. Keep it to #{user}, #H and literal text.

# If the lime session chip is ever hard to tell from the [N] chip, uncomment:
# set -g @theme_mode_normal "#7aa05a"

# Style options are NOT format-expanded -- these must be literal.
set -g status-style          "fg=#b8ff2e,bg=#16161e"
set -g mode-style            "fg=#b8ff2e,bg=#292e42"
set -g message-style         "fg=#b8ff2e,bg=#292e42"
set -g message-command-style "fg=#b8ff2e,bg=#292e42"

# The current-window chip stays purple (#bb9af7) on purpose: it encodes which
# window is focused, a different axis from which machine this is.

# --- ambient block ----------------------------------------------------------
# Comment out these four lines to drop to accent-only.
set -g pane-active-border-style "fg=#b8ff2e"
set -g pane-border-style        "fg=#26331c"
set -g window-active-style      "bg=#0e140b"
set -g window-style             "bg=#151a12"
