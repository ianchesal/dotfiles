# tmux-lite.conf -- standalone tmux config for machines that don't get the full
# setup: no TPM, no plugins, no helper scripts, no fzf. One file, installed as
# ~/.tmux.conf by bootstrap/tmux-lite.sh:
#
#   curl -fsSL https://raw.githubusercontent.com/ianchesal/dotfiles/main/bootstrap/tmux-lite.sh | bash
#
# Same keys and look as tmux.conf + theme.conf, with the plugin behaviour that
# matters inlined: vim-tmux-navigator (C-h/j/k/l), tmux-yank (copy to the local
# clipboard over OSC 52, so it works across ssh), tmux-prefix-highlight and the
# tmux-sensible defaults. Targets tmux 3.0+; newer-only options are guarded.
#
# Deliberately left out: lazygit/gh-dash/workmux popups, fzf-url, tmux-jump,
# battery, and repo-root window names (windows are named after the directory).

# ── Terminal ───────────────────────────────────────────────────────────────────
# tmux-256color carries far more modified-key entries than screen-256color, but
# a minimal box may not ship it; fall back rather than hand panes a broken TERM.
set -g default-terminal "screen-256color"
if-shell 'infocmp tmux-256color >/dev/null 2>&1' 'set -g default-terminal "tmux-256color"'
set -ga terminal-overrides ',xterm-256color:RGB,xterm-kitty:RGB'
set -ga terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl
set -ga terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # undercurl color
# OSC 52: lets copy mode (and apps in a pane) set the clipboard of the terminal
# you are sitting at, even from the far end of an ssh session
set -g set-clipboard on
set -ga terminal-overrides ',xterm*:Ms=\E]52;%p1%s;%p2%s\007'

# Modified keys (Shift-Enter, C-i vs Tab) for apps that ask for them. csi-u
# needs 3.5+; older tmux skips the whole block rather than erroring on it.
%if #{>=:#{version},3.5}
set -g extended-keys on
set -g extended-keys-format csi-u
%endif

# ── General ────────────────────────────────────────────────────────────────────
set -g bell-action none
set -g history-limit 10000
set -s escape-time 50
set -g display-time 4000
set -g focus-events on
setw -g aggressive-resize on
setw -g alternate-screen on

# ── Indexing ───────────────────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Mouse ──────────────────────────────────────────────────────────────────────
set -g mouse on

# ── Window behaviour ───────────────────────────────────────────────────────────
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"
set -g status-interval 1

# ── Key bindings ───────────────────────────────────────────────────────────────

# Passthrough prefix to inner (nested) tmux session
bind-key -n C-g send-prefix

# Reload this config
bind r source-file ~/.tmux.conf \; display "~/.tmux.conf sourced"

# Window navigation
bind -n S-Right next-window
bind -n S-Left  previous-window

# New window / splits in current directory
bind c    new-window      -c "#{pane_current_path}"
bind |    split-window -h -c "#{pane_current_path}"
bind _    split-window -v -c "#{pane_current_path}"
bind '\'  split-window -h -p 33 -c "#{pane_current_path}"

# Pane navigation, vim-tmux-navigator style: C-h/j/k/l moves between panes, but
# is passed through when the pane is running vim/nvim/fzf so those see it too
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
# C-l is taken above, so prefix C-l clears the screen instead
bind C-l send-keys C-l

# Pane resize
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5

# Session management
bind S   command-prompt -p "New Session:" "new-session -A -s '%%'"
bind C-f command-prompt -p find-session "switch-client -t %%"

# Toggles
bind m set monitor-activity
bind y set synchronize-panes\; display 'synchronize-panes #{?synchronize-panes,on,off}'

# ── Copy mode (tmux-yank, minus the plugin) ────────────────────────────────────
# v selects, C-v toggles block selection, y or a mouse drag copies. With
# set-clipboard on, the copy lands on the local machine's clipboard via OSC 52.
setw -g mode-keys vi
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# ── Status bar ─────────────────────────────────────────────────────────────────
set -g status-position top
set -g status "on"
set -g status-justify "left"

# ── Theme: Tokyo Night (Night), same palette as theme.conf ─────────────────────
set -g mode-style            "fg=#7aa2f7,bg=#292e42"
set -g message-style         "fg=#7aa2f7,bg=#292e42"
set -g message-command-style "fg=#7aa2f7,bg=#292e42"

set -g pane-border-style        "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"

# Active pane is black, inactive panes are slightly lighter
set -g window-active-style "bg=#000000"
set -g window-style        "bg=#1a1b26"

set -g status-style        "fg=#7aa2f7,bg=#16161e"
set -g status-left-style   NONE
set -g status-right-style  NONE
set -g status-left-length  100
set -g status-right-length 100

# Left: [C]/[N] mode indicator + session name
set -g status-left "#{?pane_in_mode,#[fg=#16161e]#[bg=#e0af68]#[bold] [C] #[fg=#e0af68]#[bg=#16161e]#[nobold],#[fg=#16161e]#[bg=#9ece6a]#[bold] [N] #[fg=#9ece6a]#[bg=#16161e]#[nobold]}#[fg=#16161e]#[bg=#7aa2f7]#[bold] #S #[fg=#7aa2f7]#[bg=#16161e]#[nobold]"

# Right: prefix indicator (tmux-prefix-highlight) + date/time + user@host
set -g status-right "#{?client_prefix,#[fg=#16161e]#[bg=#e0af68]#[bold] ^B #[fg=#e0af68]#[bg=#16161e]#[nobold] ,}#[fg=#7aa2f7]#[bg=#292e42] %Y-%m-%d  %H:%M #[fg=#292e42]#[bg=#16161e]#[fg=#16161e]#[bg=#7aa2f7]#[bold] #{?user,#{user},#(id -un)}@#H "

setw -g window-status-activity-style   "underscore,fg=#c0caf5,bg=#16161e"
setw -g window-status-separator        " "
setw -g window-status-style            "NONE,fg=#c0caf5,bg=#16161e"
setw -g window-status-format          " #I  #W #F "
setw -g window-status-current-format  "#[fg=#16161e]#[bg=#bb9af7]#[bold] #I  #W #F #[fg=#bb9af7]#[bg=#16161e]#[nobold]"
