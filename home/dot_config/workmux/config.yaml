# Each worktree opens as a window in the repo's own session. pax is not in that
# session: one machine-wide lead runs in the "pax" session (see
# docs/pax-workflow.md), so a worktree window runs only the planning agent.
mode: window
# don't add dagent icons to tmux windows
# status_format: false
# enable nerd fonts, duh
nerdfont: true
# default agent
agent: claude

# auto-naming is automatic when agent is configured
# auto_name:
#   background: true # Always run in background when using --auto-name

# Default pane layout. In window mode a worktree IS a single window, so the
# layout is a top-level pane list -- 'windows' is session-mode only and workmux
# rejects the config outright if both are set (src/command/add.rs).
panes:
  - command: claude --permission-mode auto
    focus: true
