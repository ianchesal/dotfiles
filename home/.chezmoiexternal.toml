# tpm only. zinit is deliberately NOT here: dot_config/zsh/dot_zshrc already
# bootstraps it into ${XDG_DATA_HOME}/zinit/zinit.git, which is where a login
# shell needs it. An external would duplicate a working mechanism.
#
# Note: an external keeps tpm ITSELF current but never installs or updates the
# plugins tpm manages -- `prefix + I` / `prefix + U` still do that, and
# `zinit update` must stay in dfu for the same reason.
[".config/tmux/plugins/tpm"]
    type = "git-repo"
    url = "https://github.com/tmux-plugins/tpm.git"
    refreshPeriod = "168h"
