########
# My ~/.rubocop.yml file
#
# Rubocop: https://github.com/bbatsov/rubocop#installation

Metrics/ClassLength:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

# A rake namespace block holds every task for one tool, so it grows past 25 lines as a
# matter of course. inherit_mode keeps Rubocop's own default exclusion (**/*.gemspec).
Metrics/BlockLength:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - '**/*.rake'

Layout/LineLength:
  Max: 160

Layout/ParameterAlignment:
  Enabled: false

Layout/SpaceAroundOperators:
  Enabled: false

Style/HashEachMethods:
  Enabled: true

Style/HashTransformKeys:
  Enabled: true

Style/HashTransformValues:
  Enabled: true
