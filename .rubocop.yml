AllCops:
  NewCops: enable
  Exclude:
    # Brewfile is Ruby, but it follows Homebrew's double-quoted house style
    - "brew/Brewfile"
    - "claude/skills/**/*"
    - "tmux/plugins/**/*"
    - "vendor/**/*"

Style/FrozenStringLiteralComment:
  Enabled: false

Style/SymbolArray:
  Enabled: false

Metrics/BlockLength:
  Max: 99

Layout/LineLength:
  Max: 200

Style/OneClassPerFile:
  Exclude:
    - "Rakefile"
