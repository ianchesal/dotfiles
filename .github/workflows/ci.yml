name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The task runner is `just`; `just lint` owns shellcheck and justfile
      # formatting so CI and a local run cannot drift apart.
      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | bash -s -- --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint shell scripts and justfiles
        run: just lint

      # test-scripts rather than test: the nvim machinery specs need a Neovim
      # 0.12 build, which is not worth installing here.
      - name: Run shell script tests
        run: just test-scripts

  config-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate YAML files
        run: |
          find . \( -name "*.yml" -o -name "*.yaml" \) | xargs -I {} sh -c 'echo "Checking {}" && python3 -c "import yaml; yaml.safe_load(open(\"{}\"))"'

      # - name: Validate JSON files
      #   run: |
      #     find . -name "*.json" | xargs -I {} sh -c 'echo "Checking {}" && python3 -m json.tool {} > /dev/null'

      - name: Validate TOML files
        run: |
          pip install toml
          find . -name "*.toml" | xargs -I {} sh -c 'echo "Checking {}" && python3 -c "import toml; toml.load(\"{}\")"'

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4.38.0
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
        env:
          SEMGREP_RULES: auto
          SEMGREP_EXCLUDE: vendor
